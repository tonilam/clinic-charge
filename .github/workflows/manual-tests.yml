name: Manual Test Runner

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Select which tests to run"
        required: true
        default: all
        type: choice
        options:
          - all
          - frontend
          - backend
          - e2e

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'frontend' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test:run

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'backend' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        run: pytest

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'e2e' }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: clinic_admin
          POSTGRES_PASSWORD: secure_password_dev
          POSTGRES_DB: clinic_charges_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Initialize database
        env:
          PGPASSWORD: secure_password_dev
        run: psql -h localhost -U clinic_admin -d clinic_charges_db -f backend/app/db/init.sql

      - name: Update frontend proxy target for CI
        run: |
          sed -i 's|http://backend:8000|http://localhost:8000|g' frontend/proxy.conf.json

      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://clinic_admin:secure_password_dev@localhost:5432/clinic_charges_db
          ENVIRONMENT: ci
          DEBUG: "false"
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:8000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to become healthy"
          cat /tmp/backend.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        env:
          CI: "true"
        run: |
          npm start > /tmp/frontend.log 2>&1 &
          echo $! > /tmp/frontend.pid

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:3000 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to start"
          cat /tmp/frontend.log
          exit 1

      - name: Run E2E tests
        working-directory: frontend
        env:
          CI: "true"
          BASE_URL: http://localhost:3000
          BACKEND_URL: http://localhost:8000
        run: npm run e2e

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            frontend/e2e/test-results
            /tmp/backend.log
            /tmp/frontend.log
